# NFL presets — every value is a default — calibrate (tune with sims and tracked results).

cash:
  min_salary: 49500
  rules:                         # passed to sports/nfl/rules.py:build_constraints
    block_qb_vs_opp_dst: true
    qb_stack_min: 0              # correlation is OFF as a forced rule in cash
    bring_back_min: 0
  by_contest:
    h2h:       {chalk_pref: 1.0}
    5050:      {chalk_pref: 1.0}
    double_up: {chalk_pref: 1.0}
    triple_up: {chalk_pref: 0.6, light_correlation: true}

gpp:
  single_entry:
    label: "Single-entry / 3-max / small field (<=1k)"
    # review 3e (Oct 15): in small fields leverage is a small lever (keep it low); duplication, salary left over and
    # product-of-ownership caps are noise -> no ownership band, no product cap, loose salary floor.
    lambda_log_own: 0.3
    cum_own_band: null
    product_own: null
    rules: {block_qb_vs_opp_dst: true, qb_stack_min: 1, bring_back_min: 0,
            max_per_team_excl: {max: 4, exclude_positions: [DST]}, soft_penalty_vs_opp_dst: 2.0}
    uniqueness_U: null
    min_salary: 48000
  simple_default:
    label: "Simple default (shadow): QB + 1 stack, no ownership logic"
    # review 3a/3e shadow portfolio: build it next to the sim-ROI portfolio; the scorecard compares finishes.
    lambda_log_own: 0.0
    cum_own_band: null
    product_own: null
    rules: {block_qb_vs_opp_dst: true, qb_stack_min: 1, bring_back_min: 0,
            max_per_team_excl: {max: 4, exclude_positions: [DST]}}
    uniqueness_U: null
    min_salary: 48000
  mid_20max:
    label: "20-max, 5k-50k field"
    lambda_log_own: 1.0
    cum_own_band: [0.90, 1.40]
    product_own: {min_players_under: 1, under_pct: 0.08}
    rules: {block_qb_vs_opp_dst: true, qb_stack_min: 1, qb_stack_max: 2, bring_back_min: 0,
            max_per_team_excl: {max: 4, exclude_positions: [DST]}, soft_penalty_vs_opp_dst: 2.0}
    uniqueness_U: 2
    min_salary: 49000
  large_150max:
    label: "150-max, 100k+ Milly-style"
    lambda_log_own: 1.5
    cum_own_band: [0.80, 1.20]
    product_own: {min_players_under: 1, under_pct: 0.05, log10_cap: -8.0}
    rules: {block_qb_vs_opp_dst: true, qb_stack_min: 2, bring_back_min: 1, bring_back_game_total_min: 48,
            max_per_team_excl: {max: 4, exclude_positions: [DST]}, soft_penalty_vs_opp_dst: 2.0}
    uniqueness_U: 3
    min_salary: 49000
  # Portfolio defaults (Section 7.3)
  portfolio:
    max_shared_players: 6        # overlap limit between any two lineups (9-man NFL)
    max_exposure: 0.6
    shortlist: 25                # candidates re-scored exactly per greedy step
    approx_sims: null            # sims used to rank the shortlist (null = all; ~2000 speeds up 150-max)

showdown:                        # Section 8 — default — calibrate
  cash:
    min_salary: 48000
    rules: {sd_k_dst_max: 2, sd_qb_cpt_catcher: true, sd_kdst_cpt_penalty: 3.0, sd_kdst_cpt_total: 40,
            block_qb_vs_opp_dst: true}
  gpp:
    label: "Showdown GPP"
    lambda_log_own: 1.0
    cum_own_band: null
    product_own: {min_players_under: 1, under_pct: 0.10}
    rules: {sd_k_dst_max: 2, sd_qb_cpt_catcher: true, sd_cpt_bring_back: true, sd_kdst_cpt_penalty: 3.0,
            sd_kdst_cpt_total: 40, sd_wrte_cpt_qb_penalty: 2.0}
    uniqueness_U: 1
    min_salary: 46000

field:                           # field models (Section 5.3) — default — calibrate
  gpp:
    kappa: 200
    stacker_q: 0.6
    second_catcher_p: 0.4
    bring_back_p: 0.35
    salary_floor: 49200
    showdown_salary_floor: 44000
    consensus_p: 0.0
  cash:
    kappa: 600
    stacker_q: 0.3
    second_catcher_p: 0.4
    bring_back_p: 0.35
    salary_floor: 49700
    showdown_salary_floor: 46000
    consensus_p: 0.5             # share of entrants drawn from consensus_cash.csv (+0-2 value pivots)
    sharp_consensus_p: 0.8       # H2H opponent labelled "sharp"
    max_pivots: 2
  fit:
    iterations: 12
    tolerance_pp: 1.5
    fit_sample: 6000
    rake_handoff_pp: 5           # stop reweighting below 5 pp max error; raking finishes (same final error, ~10x faster)
