# App-level defaults. Every tunable here is a default — calibrate.
data_dir: data
default_sport: nfl
seed: 20261013
sims:
  n: 10000          # configurable up to 50000
  max: 50000
  chunk: 2000
  dtype: float32
cash:                 # default — calibrate
  candidates: {top_k: 60, blends: [0.2, 0.4], blend_k: 30, fade_pivots: 15, neighbor_swaps: 5}   # 60/30 picked the same lineup as 300/100 on a 261-player slate at 1/13 the time
  field_pool: 3000    # field lineups generated per run; contest opponents are drawn from it by weight
  mv_lambda: 0.01     # reported mean-variance score E[D] -/+ lambda Var(D)
  alternatives: 5
  alt_min_diff: 2
  chalk_threshold: 0.40
  low_own_threshold: 0.30
  free_square_salary: 4500
  free_square_own: 0.50
gpp:
  pool_size: 2000
  pool_max: 10000
name_match_threshold: 0.86
bankroll:
  warn_slate_frac: 0.10
  warn_single_gpp_frac: 0.02
